<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Contact CrackIt</title>

    <link rel="stylesheet" href="public.css">

</head>


<body>


<nav class="navbar">

    <a href="index.html" class="logo">
        Crack<span>It</span>
    </a>


    <div class="nav-links">

        <a href="index.html">
            Home
        </a>

        <a href="exams.html">
            Exams
        </a>

        <a href="index.html#test-series">
            Test Series
        </a>

        <a href="about.html">
            About
        </a>

        <a href="contact.html"
           class="active">
            Contact
        </a>

    </div>


    <div class="nav-buttons">

        <a href="login.html"
           class="login-btn">
            Login
        </a>

        <a href="signup.html"
           class="signup-btn">
            Sign Up
        </a>

    </div>

</nav>



<section class="page-hero">

    <p class="page-label">
        CONTACT US
    </p>

    <h1>
        How can we help?
    </h1>

    <p>

        Have a question about CrackIt, your account,
        a test series or anything else? Send us a message.

    </p>

</section>



<div class="contact-container">


    <form>


        <div class="form-group">

            <label for="name">
                Name
            </label>

            <input
                type="text"
                id="name"
                placeholder="Your name"
                required
            >

        </div>



        <div class="form-group">

            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                placeholder="you@example.com"
                required
            >

        </div>



        <div class="form-group">

            <label for="subject">
                Subject
            </label>

            <input
                type="text"
                id="subject"
                placeholder="How can we help?"
                required
            >

        </div>



        <div class="form-group">

            <label for="message">
                Message
            </label>

            <textarea
                id="message"
                placeholder="Write your message..."
                required
            ></textarea>

        </div>



        <button
            type="submit"
            class="submit-btn">

            Send Message

        </button>


    </form>


</div>


</body>

</html>
