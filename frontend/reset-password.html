<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Reset Password | CrackIt</title>

    <link rel="stylesheet" href="auth.css">

</head>


<body>


<div class="auth-page">


    <!-- LEFT SIDE -->

    <div class="auth-left">

        <a href="index.html" class="logo">
            Crack<span>It</span>
        </a>


        <div class="left-content">

            <div class="small-badge">
                🔐 Secure your account
            </div>


            <h1>

                Create a new<br>

                <span>password.</span>

            </h1>


            <p>

                Choose a strong password to protect your
                CrackIt account and continue your preparation.

            </p>

        </div>

    </div>



    <!-- RIGHT SIDE -->

    <div class="auth-right">


        <div class="auth-box">


            <div class="mobile-logo">

                Crack<span>It</span>

            </div>


            <h2>
                Reset password
            </h2>


            <p class="auth-subtitle">

                Enter your new password below.

            </p>



            <form id="resetForm">


                <!-- NEW PASSWORD -->

                <div class="form-group">

                    <label for="newPassword">

                        New password

                    </label>


                    <div class="password-container">

                        <input
                            type="password"
                            id="newPassword"
                            placeholder="Enter new password"
                            minlength="8"
                            required
                        >


                        <button
                            type="button"
                            class="show-password"
                            onclick="togglePassword('newPassword', this)"
                        >

                            Show

                        </button>

                    </div>


                    <small class="form-help">

                        Use at least 8 characters.

                    </small>

                </div>



                <!-- CONFIRM PASSWORD -->

                <div class="form-group">

                    <label for="confirmNewPassword">

                        Confirm password

                    </label>


                    <div class="password-container">

                        <input
                            type="password"
                            id="confirmNewPassword"
                            placeholder="Enter password again"
                            minlength="8"
                            required
                        >


                        <button
                            type="button"
                            class="show-password"
                            onclick="togglePassword('confirmNewPassword', this)"
                        >

                            Show

                        </button>

                    </div>

                </div>


                <!-- ERROR -->

                <p
                    id="resetError"
                    class="form-error"
                ></p>



                <button
                    type="submit"
                    class="auth-button"
                >

                    Reset Password

                </button>


            </form>



            <p class="switch-page">

                Remember your password?

                <a href="login.html">

                    Login

                </a>

            </p>


        </div>

    </div>

</div>


<script src="auth.js"></script>


</body>

</html>
